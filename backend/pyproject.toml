[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "1luz-sideral-backend"
version = "0.1.0"
description = "FastAPI backend: NISAR search and extraction for 1luz_sideral"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    # nisar_extractor (pins from notebooks/jose/requirements-nisar-extractor.txt)
    "asf_search==14.1.0",
    "harmony-py==1.8.0",
    "requests==2.34.2",
    "numpy==2.5.4",
    "shapely==2.2.0",
    "pyproj==3.8.0",
    "rasterio==1.5.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    # U-Net water model (app/water). CPU-only wheels: pip install torch --index-url https://download.pytorch.org/whl/cpu
    "torch>=2.4",
    "h5py>=3.11",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
app = ["data/*.json", "water/*.pt", "water/*.json"]

# Resolve torch from the CPU-only PyTorch index (uv).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
